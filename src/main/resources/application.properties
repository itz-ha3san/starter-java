spring.application.name=s3-payment-service
server.address=0.0.0.0
server.port=8083

# ──────────────────────────────────────────────
# Database (GEN-12: independent PostgreSQL per service)
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.open-in-view=false

# ──────────────────────────────────────────────
# Database migrations (Flyway)
# Existing non-empty databases are baselined at version 0, then hardened
# by V1. New databases run V1 from an empty schema.
# ──────────────────────────────────────────────
# Spring Boot 4 requires spring-boot-starter-flyway on the classpath;
# flyway-core + the PostgreSQL database module alone are not sufficient.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never

# ──────────────────────────────────────────────
# Kafka (ADR-0001: inter-service communication)
# ──────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=edu.softwarelab.starter.messaging,edu.softwarelab.starter.messaging.dto,edu.softwarelab.starter.domain
spring.kafka.listener.ack-mode=manual

# ──────────────────────────────────────────────
# S3 orchestration tuning
# ──────────────────────────────────────────────
s3.risk-assessment.timeout-seconds=10
s3.external-transfer.timeout-seconds=30
s3.outbox.poll-interval-ms=500
s3.outbox.batch-size=25

# ──────────────────────────────────────────────
# Logging (GEN-11: structured JSON, correlation_id)
# ──────────────────────────────────────────────
logging.pattern.console={"time":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%p","service":"${spring.application.name}","correlation_id":"%X{correlation_id:-}","logger":"%c","msg":"%m"}%n
