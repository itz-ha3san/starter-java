openapi: 3.1.0
info:
  title: LabBank S3 Payment — Frontend API
  version: 1.0.0
  description: >-
    REST API that the S3 (Payment Orchestration) backend exposes to its own
    frontend. This is NOT the inter-service contract; inter-service
    communication uses Kafka and is documented in asyncapi/*.yaml. The frontend
    calls these endpoints; S3 then orchestrates the transfer via Kafka commands
    to S1, S2, S4 and S5. Professor-approved Kafka-over-REST substitution for
    inter-service traffic is documented in ADR-0001.
  contact:
    name: LabBank S3 Team
servers:
  - url: http://localhost:8083/api/v1
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [health]
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          description: Too many health-check requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /ready:
    get:
      operationId: getReady
      summary: Readiness probe (checks DB + Kafka)
      tags: [health]
      responses:
        '200':
          description: All dependencies ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          description: Too many health-check requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /transfers:
    post:
      operationId: createTransfer
      summary: Create a new transfer request
      description: >-
        Accepts a transfer request, validates it, persists it to PostgreSQL,
        and starts the Kafka-based orchestration (risk check → hold funds →
        execute). The Idempotency-Key header is required for exactly-once
        semantic at the API boundary.
      tags: [transfers]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
            examples:
              internal:
                summary: Internal transfer between two LabBank accounts
                value:
                  source_account_number: '001200456789'
                  dest_account_number: '001200987654'
                  amount: 2500000
                  currency: IRR
                  description: Lunch split
              external:
                summary: External transfer to another bank via IBAN
                value:
                  source_account_number: '001200456789'
                  dest_iban: IR430120000000000000000001
                  amount: 2500000
                  currency: IRR
                  description: Rent payment
      responses:
        '201':
          description: Transfer created and accepted for processing
          headers:
            Location:
              description: URL of the created transfer resource
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /transfers/{id}:
    get:
      operationId: getTransfer
      summary: Get the current state of a transfer
      tags: [transfers]
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Transfer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '404':
          $ref: '#/components/responses/NotFound'
  /transfers/{id}/events:
    get:
      operationId: getTransferEvents
      summary: List the event history of a transfer
      tags: [transfers]
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Event list with pagination cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferEventPage'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TransferId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the transfer.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: >-
        Client-supplied idempotency key. Repeating the same key + body returns
        the same response. Repeating the same key with a different body returns
        409 IDEMPOTENCY_KEY_REUSED.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: >-
        Propagated correlation ID. If absent the server generates one and
        echoes it in the response header and every log line.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict with current resource state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
      required: [status]
    IranianIBAN:
      type: string
      pattern: ^IR[0-9]{24}$
      minLength: 26
      maxLength: 26
      description: Iranian IBAN per GEN-13.
    AccountNumber:
      type: string
      pattern: ^[0-9]{10,12}$
      minLength: 10
      maxLength: 12
      description: LabBank internal account number.
    CreateTransferRequest:
      type: object
      additionalProperties: false
      properties:
        source_account_number:
          $ref: '#/components/schemas/AccountNumber'
        dest_account_number:
          $ref: '#/components/schemas/AccountNumber'
          description: Required for internal transfers. Mutually exclusive with dest_iban.
        dest_iban:
          $ref: '#/components/schemas/IranianIBAN'
          description: Required for external transfers. Mutually exclusive with dest_account_number.
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        currency:
          type: string
          const: IRR
        description:
          type: string
          maxLength: 256
      required:
        - source_account_number
        - amount
        - currency
      oneOf:
        - required: [dest_account_number]
        - required: [dest_iban]
    TransferStatus:
      type: string
      enum:
        - PENDING
        - RISK_CHECKING
        - RISK_REJECTED
        - RISK_MANUAL_REVIEW
        - HOLDING
        - HOLD_FAILED
        - EXECUTING
        - SETTLED
        - FAILED
        - REVERSED
      description: >-
        PENDING: just created. RISK_CHECKING: AssessRisk sent to S4.
        RISK_REJECTED: S4 said REJECTED. RISK_MANUAL_REVIEW: S4 said
        MANUAL_REVIEW or timed out. HOLDING: HoldFunds sent to S2. HOLD_FAILED:
        S2 hold failed. EXECUTING: command sent to S2 (internal) or S5
        (external). SETTLED: success. FAILED: terminal failure. REVERSED:
        compensating reversal applied.
    Transfer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        source_account_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Resolved by S1; null until authorization completes.
        dest_account_id:
          type:
            - string
            - 'null'
          format: uuid
        dest_iban:
          $ref: '#/components/schemas/IranianIBAN'
        amount:
          type: integer
          format: int64
        currency:
          type: string
          const: IRR
        status:
          $ref: '#/components/schemas/TransferStatus'
        is_internal:
          type: boolean
        description:
          type:
            - string
            - 'null'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
        correlation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
      required:
        - id
        - amount
        - currency
        - status
        - is_internal
        - created_at
        - updated_at
    TransferEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        transfer_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - CREATED
            - AUTHORIZATION_CHECKED
            - RISK_ASSESSED
            - FUNDS_HELD
            - FUNDS_CAPTURED
            - FUNDS_RELEASED
            - TRANSFER_EXECUTED
            - TRANSFER_SETTLED
            - TRANSFER_FAILED
            - TRANSFER_REVERSED
        payload:
          type: object
          additionalProperties: true
          description: Event-specific data.
        occurred_at:
          type: string
          format: date-time
          pattern: Z$
      required: [id, transfer_id, event_type, occurred_at]
    TransferEventPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransferEvent'
        next_cursor:
          type:
            - string
            - 'null'
      required: [data]
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          default: 'https://errors.labbank.example/problem'
        instance:
          type: string
          format: uri-reference
          description: Request path associated with this problem.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - IDEMPOTENCY_KEY_REUSED
            - SERVICE_UNAVAILABLE
            - UPSTREAM_TIMEOUT
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
      required: [type, title, status, code, detail, correlation_id]
