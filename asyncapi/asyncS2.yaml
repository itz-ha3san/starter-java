asyncapi: 3.0.0
info:
  title: LabBank S3 ↔ S2 — typed ledger replies
  version: 1.0.0
  description: >-
    S3 perspective. Final v1.0: six typed replies, explicit AsyncAPI
    request/reply mapping, and operation_id idempotency. Baseline checked
    against local api.txt. Professor-approved Kafka-over-REST substitution is
    documented in ADR-0001. S2 Kafka support, successful response fields,
    inquiry state model, deployment and security require S2 agreement.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Local-development example only. Production addresses and SASL/TLS policy require agreement.
channels:
  sendHoldFunds:
    address: lab.s3.s2.command.funds.hold.v3
    messages:
      HoldFunds:
        $ref: '#/components/messages/HoldFunds'
    description: S3 produces, S2 consumes. UTF-8 Kafka record key = payload.transaction_id; receiver checks equality.
      Same key orders within a partition of THIS topic only, not across command topics.
  sendExecuteInternalTransfer:
    address: lab.s3.s2.command.transfer.internal.v3
    messages:
      ExecuteInternalTransfer:
        $ref: '#/components/messages/ExecuteInternalTransfer'
    description: S3 produces, S2 consumes. UTF-8 Kafka record key = payload.transaction_id; receiver checks equality.
      Same key orders within a partition of THIS topic only, not across command topics.
  sendCaptureFunds:
    address: lab.s3.s2.command.funds.capture.v3
    messages:
      CaptureFunds:
        $ref: '#/components/messages/CaptureFunds'
    description: S3 produces, S2 consumes. UTF-8 Kafka record key = payload.transaction_id; receiver checks equality.
      Same key orders within a partition of THIS topic only, not across command topics.
  sendReleaseFunds:
    address: lab.s3.s2.command.funds.release.v3
    messages:
      ReleaseFunds:
        $ref: '#/components/messages/ReleaseFunds'
    description: S3 produces, S2 consumes. UTF-8 Kafka record key = payload.transaction_id; receiver checks equality.
      Same key orders within a partition of THIS topic only, not across command topics.
  sendReverseTransfer:
    address: lab.s3.s2.command.transfer.reverse.v3
    messages:
      ReverseTransfer:
        $ref: '#/components/messages/ReverseTransfer'
    description: S3 produces, S2 consumes. UTF-8 Kafka record key = payload.transaction_id; receiver checks equality.
      Same key orders within a partition of THIS topic only, not across command topics.
  sendInquireLedgerOperation:
    address: lab.s3.s2.command.operation.inquire.v3
    messages:
      InquireLedgerOperation:
        $ref: '#/components/messages/InquireLedgerOperation'
    description: S3 produces, S2 consumes. UTF-8 Kafka record key = payload.transaction_id; receiver checks equality.
      Same key orders within a partition of THIS topic only, not across command topics.
  receiveS2Result:
    address: lab.s2.s3.event.operation-result.v3
    messages:
      HoldFundsResult:
        $ref: '#/components/messages/HoldFundsResult'
      ExecuteInternalTransferResult:
        $ref: '#/components/messages/ExecuteInternalTransferResult'
      CaptureFundsResult:
        $ref: '#/components/messages/CaptureFundsResult'
      ReleaseFundsResult:
        $ref: '#/components/messages/ReleaseFundsResult'
      ReverseTransferResult:
        $ref: '#/components/messages/ReverseTransferResult'
      InquireLedgerOperationResult:
        $ref: '#/components/messages/InquireLedgerOperationResult'
    description: S2 produces, S3 consumes. Exactly one of six message schemas applies, selected by message_type
      const; see each send operation.reply.messages. UTF-8 key=transaction_id. Duplicate result delivery is possible;
      S3 deduplicates message_id and applies state transitions idempotently. Replies may be delayed or absent after
      transport failure.
operations:
  sendHoldFunds:
    action: send
    channel:
      $ref: '#/channels/sendHoldFunds'
    messages:
    - $ref: '#/channels/sendHoldFunds/messages/HoldFunds'
    reply:
      channel:
        $ref: '#/channels/receiveS2Result'
      messages:
      - $ref: '#/channels/receiveS2Result/messages/HoldFundsResult'
    summary: HoldFunds → HoldFundsResult
    description: Fixed asynchronous reply channel; no dynamic reply-to topic. S2 must publish the matching typed
      result; Kafka acknowledgement is not this result.
  sendExecuteInternalTransfer:
    action: send
    channel:
      $ref: '#/channels/sendExecuteInternalTransfer'
    messages:
    - $ref: '#/channels/sendExecuteInternalTransfer/messages/ExecuteInternalTransfer'
    reply:
      channel:
        $ref: '#/channels/receiveS2Result'
      messages:
      - $ref: '#/channels/receiveS2Result/messages/ExecuteInternalTransferResult'
    summary: ExecuteInternalTransfer → ExecuteInternalTransferResult
    description: Fixed asynchronous reply channel; no dynamic reply-to topic. S2 must publish the matching typed
      result; Kafka acknowledgement is not this result.
  sendCaptureFunds:
    action: send
    channel:
      $ref: '#/channels/sendCaptureFunds'
    messages:
    - $ref: '#/channels/sendCaptureFunds/messages/CaptureFunds'
    reply:
      channel:
        $ref: '#/channels/receiveS2Result'
      messages:
      - $ref: '#/channels/receiveS2Result/messages/CaptureFundsResult'
    summary: CaptureFunds → CaptureFundsResult
    description: Fixed asynchronous reply channel; no dynamic reply-to topic. S2 must publish the matching typed
      result; Kafka acknowledgement is not this result.
  sendReleaseFunds:
    action: send
    channel:
      $ref: '#/channels/sendReleaseFunds'
    messages:
    - $ref: '#/channels/sendReleaseFunds/messages/ReleaseFunds'
    reply:
      channel:
        $ref: '#/channels/receiveS2Result'
      messages:
      - $ref: '#/channels/receiveS2Result/messages/ReleaseFundsResult'
    summary: ReleaseFunds → ReleaseFundsResult
    description: Fixed asynchronous reply channel; no dynamic reply-to topic. S2 must publish the matching typed
      result; Kafka acknowledgement is not this result.
  sendReverseTransfer:
    action: send
    channel:
      $ref: '#/channels/sendReverseTransfer'
    messages:
    - $ref: '#/channels/sendReverseTransfer/messages/ReverseTransfer'
    reply:
      channel:
        $ref: '#/channels/receiveS2Result'
      messages:
      - $ref: '#/channels/receiveS2Result/messages/ReverseTransferResult'
    summary: ReverseTransfer → ReverseTransferResult
    description: Fixed asynchronous reply channel; no dynamic reply-to topic. S2 must publish the matching typed
      result; Kafka acknowledgement is not this result.
  sendInquireLedgerOperation:
    action: send
    channel:
      $ref: '#/channels/sendInquireLedgerOperation'
    messages:
    - $ref: '#/channels/sendInquireLedgerOperation/messages/InquireLedgerOperation'
    reply:
      channel:
        $ref: '#/channels/receiveS2Result'
      messages:
      - $ref: '#/channels/receiveS2Result/messages/InquireLedgerOperationResult'
    summary: InquireLedgerOperation → InquireLedgerOperationResult
    description: Fixed asynchronous reply channel; no dynamic reply-to topic. S2 must publish the matching typed
      result; Kafka acknowledgement is not this result.
  receiveS2Result:
    action: receive
    channel:
      $ref: '#/channels/receiveS2Result'
    messages:
    - $ref: '#/channels/receiveS2Result/messages/HoldFundsResult'
    - $ref: '#/channels/receiveS2Result/messages/ExecuteInternalTransferResult'
    - $ref: '#/channels/receiveS2Result/messages/CaptureFundsResult'
    - $ref: '#/channels/receiveS2Result/messages/ReleaseFundsResult'
    - $ref: '#/channels/receiveS2Result/messages/ReverseTransferResult'
    - $ref: '#/channels/receiveS2Result/messages/InquireLedgerOperationResult'
