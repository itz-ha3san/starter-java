  schemas:
    OperationError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        retryable:
          type: boolean
        public_message:
          type: string
          minLength: 1
        problem:
          $ref: '#/components/schemas/Problem'
      required:
      - code
      - retryable
      - public_message
      - problem
      description: Application command-processing error, not a Kafka broker status. code supports base project codes
        and service extensions. Broker ACL/auth/size failures can prevent delivery and may produce no result message.
        All fields are required. problem.code must equal code; problem.correlation_id must equal the envelope correlation_id
        (runtime checks). retryable does not authorize starting a new operation; first resolve uncertain financial
        state.
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
          description: 'Stable machine-readable code. Base examples: VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN,
            NOT_FOUND, CONFLICT, IDEMPOTENCY_KEY_REUSED, SERVICE_UNAVAILABLE, UPSTREAM_TIMEOUT. Service-specific
            codes are permitted.'
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
      required:
      - code
      - correlation_id
      - detail
      - status
      - title
      - type
    LedgerInquiryData:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - NOT_STARTED
          - HELD
          - INTERNAL_TRANSFERRED
          - CAPTURED
          - RELEASED
          - REVERSED
          - UNKNOWN
          description: Proposed S2 durable transfer state, not S3 end-to-end payment/settlement status. NOT_STARTED
            only after an authoritative lookup; never infer from timeout or missing consumption. UNKNOWN is not
            safe to execute again.
      required:
      - state
      description: 'New proposed extension: api.txt does not specify an inquiry response body. S2 must approve these
        state names and semantics before implementation. A successful query can legitimately return state UNKNOWN.
        Return handling outcome UNKNOWN plus error if the query itself cannot be completed.'
    HoldFunds:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '3.0'
        transaction_id:
          type: string
          format: uuid
          description: Banking transfer UUID assigned and persisted by S3 before the first command; identical across
            all steps and results. NOT a Kafka-generated ID, broker offset, producer ID, or Kafka transactional.id.
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an ordering
            guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S3-PAY
        message_type:
          type: string
          const: HoldFunds.v3
        operation_id:
          type: string
          format: uuid
          description: 'S3-assigned UUID of ONE logical command/step, also its application idempotency key. New
            step: new UUID. Retry or republish of this step: same UUID and same semantic inputs. Inquiry operation_id
            identifies this query, not the queried mutation.'
        data:
          type: object
          additionalProperties: false
          properties:
            src_account_id:
              type: string
              pattern: ^[0-9]+$
              minLength: 1
              description: Account NUMBER, not a UUID or IBAN. Preserve leading zeroes. Length is provider-defined.
            amount:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
              description: Positive integer Iranian rials. Do not parse through floating-point types.
            currency:
              type: string
              const: IRR
              description: ISO 4217 currency; all amounts in this draft are Iranian rials.
          required:
          - src_account_id
          - amount
          - currency
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - data
      description: Proposed HoldFunds command. Deduplicate by authenticated S3 principal + operation_id; type, transaction_id
        and canonical business data are bound to the key. See x-contract-rules.
      x-rest-mapping:
        path: /api/v1/ldg/hold
        request-field-locations:
          transaction_id: payload.transaction_id
          src_account_id: payload.data.src_account_id
          amount: payload.data.amount
          currency: payload.data.currency
        success-http-equivalent: 201
    HoldFundsResultData:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: HELD
          description: Proposed typed acknowledgement of the durable S2 effect, not an HTTP code or end-to-end settlement
            result.
      required:
      - status
    HoldFundsResult:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '3.0'
        transaction_id:
          type: string
          format: uuid
          description: Banking transfer UUID assigned and persisted by S3 before the first command; identical across
            all steps and results. NOT a Kafka-generated ID, broker offset, producer ID, or Kafka transactional.id.
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
          description: message_id of the command that triggered this result. operation_id remains the identity of
            the logical operation across retries.
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an ordering
            guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S2-LDG
        message_type:
          type: string
          const: HoldFundsResult.v3
        operation_id:
          type: string
          format: uuid
