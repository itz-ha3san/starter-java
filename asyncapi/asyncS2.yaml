      description: Proposed InquireLedgerOperation command. Deduplicate by authenticated S3 principal + operation_id;
        type, transaction_id and canonical business data are bound to the key. See x-contract-rules. New intentional
        poll uses a new operation_id; retries of that poll retain it. Do not cache the first poll forever by transaction_id.
      x-rest-mapping:
        path: /api/v1/ldg/inquiry
        request-field-locations:
          transaction_id: payload.transaction_id
        success-http-equivalent: 200
    InquireLedgerOperationResult:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '3.0'
        transaction_id:
          type: string
          format: uuid
          description: Banking transfer UUID assigned and persisted by S3 before the first command; identical across
            all steps and results. NOT a Kafka-generated ID, broker offset, producer ID, or Kafka transactional.id.
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
          description: message_id of the command that triggered this result. operation_id remains the identity of
            the logical operation across retries.
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an ordering
            guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S2-LDG
        message_type:
          type: string
          const: InquireLedgerOperationResult.v3
        operation_id:
          type: string
          format: uuid
          description: Echo the triggering logical command operation_id unchanged. Never generate a new operation_id
            in S2.
        outcome:
          type: string
          enum:
          - APPLIED
          - REJECTED
          - UNKNOWN
          - PENDING
          description: Handling outcome of the corresponding InquireLedgerOperation command, NOT overall settlement
            status. APPLIED means durable local effect (or completed inquiry); PENDING/UNKNOWN must not be treated
            as success.
        data:
          $ref: '#/components/schemas/LedgerInquiryData'
        error:
          $ref: '#/components/schemas/OperationError'
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - causation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - outcome
      allOf:
      - if:
          properties:
            outcome:
              const: APPLIED
          required:
          - outcome
        then:
          required:
          - data
          not:
            required:
            - error
      - if:
          properties:
            outcome:
              enum:
              - REJECTED
              - UNKNOWN
          required:
          - outcome
        then:
          required:
          - error
          not:
            required:
            - data
      - if:
          properties:
            outcome:
              const: PENDING
          required:
          - outcome
        then:
          not:
            anyOf:
            - required:
              - data
            - required:
              - error
      description: Only valid reply to InquireLedgerOperation. Echo transaction_id/correlation_id/operation_id;
        causation_id is the triggering command message_id. Success data shape is explicitly defined. These equality
        checks and dispatch by operation_id require application validation.
x-contract-rules:
  perspective: Actions are from S3 perspective. S2 reverses command send to receive and result receive to send,
    preserving addresses and schemas. AsyncAPI operation.reply describes allowed replies, not an automatic RPC server
    or generated implementation.
  identity: S3 persists transaction_id for the banking transfer. Kafka offsets, transactional.id and producer IDs
    are transport concepts, not this business UUID. All steps share transaction_id; each distinct step has a distinct
    operation_id. Command/result messages each have a message_id. correlation_id traces the workflow; causation_id
    links the result to its triggering command.
  idempotency: operation_id IS the internal idempotency key, so a second idempotency_key is intentionally omitted.
    Scope = authenticated producer principal + operation_id across command types. Persist binding to command type
    + transaction_id + normalized semantic data; reject reuse with changed inputs using IDEMPOTENCY_KEY_REUSED.
    Broker redelivery/outbox replay preserves message_id; a new retry publication may use a new message_id but must
    preserve operation_id. Do not include timestamps/message IDs in the business fingerprint. Do not equate transaction_id
    with a step idempotency key.
  idempotency-implementation: S2 must atomically persist dedup binding, business mutation and durable result/outbox
    in its own database. Concurrent duplicates must serialize. Persist success and final rejection; duplicates return
    the stored outcome, not a second money movement. Authentication/authorization is checked even for a duplicate.
    A replay response uses the current triggering command message_id as causation_id, same operation_id, with its
    own persisted outbox/message identity. Duplicate delivery of the same stored response keeps its message_id.
    Retention must cover all permitted retries/replays and financial audit; do not expire keys while old commands
    remain replayable. Kafka producer idempotence/transactions alone do not deduplicate external DB effects.
  http-key: External HTTP Idempotency-Key remains as required by GEN-07; S3 persists its mapping to transaction_id
    and per-step operation_id values. Do not use the same external key as every internal step key. Repeated HTTP
    key + changed body returns IDEMPOTENCY_KEY_REUSED.
  empty-data: 'Capture/Release/Reverse/Inquiry require data: {} because transaction_id already exists in the envelope,
    exactly covering their api.txt request. No duplicate data.transaction_id, amount, account IDs, hold ID or ledger
    ID is required. This assumes a unique canonical S2 target per transfer; if S2 permits multiple holds/postings
    per transfer, a new agreed target identifier contract is required.'
  account-identifiers: As previously clarified for S2, src_account_id/dest_account_id are decimal account NUMBER
    strings, NOT UUIDs or IBANs. This differs from S1 canonical UUID account IDs. S3 must retain both number and
    ID; never forward S1 UUID blindly into S2 number fields. Names retained to match api.txt.
  responses: Each command has one dedicated message_type and success data schema, explicitly selected by operation.reply.messages.
    Shared reply topic is deliberate and valid. S3 additionally checks expected command type by operation_id and
    transaction_id/correlation_id/causation_id linkage. A valid but unexpected typed result must not advance the
    workflow.
  outcomes: 'APPLIED: data required, error forbidden. REJECTED/UNKNOWN: error required, data forbidden. PENDING:
    neither data nor error. REJECTED means definitively no new local effect from this command; UNKNOWN means effect
    is not known. PENDING is nonterminal; provider must durably complete/recover and publish final result, or S3
    must inquire. Timeout is not rejection.'
  financial-state: 'S2 alone validates preconditions atomically: Hold changes available, not book balance; internal
    transfer writes balanced immutable debit/credit entries; Capture posts an active hold exactly once; Release
    frees an active hold without money movement; Reverse creates balanced compensating entries referencing original
    postings, never edits/deletes originals. No double spend. Capture vs Release race and repeating a financial
    step under another operation_id must also be guarded by transfer/hold/journal state and uniqueness, not just
    dedup.'
  ordering: S3 waits for the matching durable result before dependent steps. Kafka gives no ordering across topics.
    S2 validates state/version under a DB lock or equivalent concurrency control. Unknown external settlement must
    not cause blind release/reversal. S3 owns saga orchestration; S2 reports only local ledger effects.
  inquiry: operation_id identifies this query. Target is transaction_id. A fresh intentional poll gets a new operation_id
    and a fresh authoritative snapshot. Query retries may return its stored snapshot. state is proposed local ledger
    state, not S3 status. NOT_STARTED/NOT_FOUND must never be inferred just from a missing result, offset lag or
    timeout; pending/in-flight commands may still execute. Do not issue a new financial operation merely because
    inquiry says NOT_STARTED without coordinating cancellation/state guards.
  errors: OperationError is an application result, not broker error. problem.status is HTTP-equivalent classification;
    Kafka itself has no 400/401/403/etc response message. Base project codes and documented S2 extensions use one
    error schema. Broker auth/ACL/record-size failures may prevent delivery and produce no result. Runtime must
    enforce error.code=problem.code and matching correlation_id.
  security: Actual broker addresses, TLS/SASL, ACLs and S2 authorization require agreement. producer in payload
    is not authentication. Keep credentials out of payloads/logs/examples; configure secrets via environment. This
    revision does not assume the S1 delegated token header is also valid for S2.
  compatibility: Breaking proposed v3 replaces the earlier v2 shape; command/reply topic suffix v3, schema_version
    3.0, message types v3. Do not mix with v2 consumers. Coordinate provider approval, provisioning, ACLs, consumers,
    rollout and retirement; never run both generations for the same financial workflow without shared dedup/state
    protection.
  approval: api.txt specifies request fields and HTTP 201/200/400 only. Typed success status fields and LedgerInquiryData
    state model are proposed additions, not copied from a provider contract. Additional currency=IRR carries GEN-03.
    S2 must approve body/state model, single-target assumption, idempotency, authentication and Kafka support before
    this becomes executable. No code, broker, api.txt or master asyncAPI file is modified.
